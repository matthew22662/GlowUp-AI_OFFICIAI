services:
  - type: web
    name: glowup-ai-official
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_MEMORY_DATABASE
        value: "true"
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@glowup.ai
      - key: ADMIN_PASSWORD
        value: GlowUpAdmin!2026
      - key: REQUIRE_AI
        value: "false"
      - key: OPENAI_VISION_MODEL
        value: gpt-5-mini
      - key: DATABASE_POOL_MAX
        value: "8"
